# Ana Dépôt API: test, build, push and deploy to the DEV Azure Container App.
# Operator guide (one-time Azure/GitHub setup, rollback): docs/deployment/github-actions-dev.md
#
#   push to main / manual run  ->  mvn verify  ->  docker build (existing Dockerfile)  ->  push to ACR (tag = commit SHA)  ->  az containerapp update
#
# The deploy job needs the test job: a red test run never reaches Azure. No secret is stored in this repository; Azure access is OIDC (no password, no client secret).

name: Deploy API (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push waits for the running one instead of cancelling it half way through a rollout.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Existing Azure resources (nothing here is created by the workflow). Override with repository VARIABLES, never with secrets: these are names, not credentials.
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'ana-company-dev-rg' }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP || 'ana-depot-api-dev' }}
  ACR_NAME: ${{ vars.ACR_NAME || 'anadepotdevregistry' }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'anadepotdevregistry.azurecr.io' }}
  IMAGE_REPOSITORY: ana-depot-api

jobs:
  test:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The integration tests start PostgreSQL and MinIO with Testcontainers; the GitHub-hosted runner provides Docker.
      - name: Run the test suite
        run: mvn -B -ntp verify

  deploy:
    name: Build image, push to ACR, deploy to dev
    needs: test
    # Only the main branch deploys. A manual run from another branch still runs the tests above, but never reaches Azure (the federated credential is also scoped to main).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write   # lets azure/login exchange the GitHub OIDC token for an Azure token; nothing else needs it
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER || 'anadepotdevregistry.azurecr.io' }}/ana-depot-api:${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The existing Dockerfile (multi-stage, non-root, no secret baked in). The tag is the commit SHA; there is no `latest`.
      - name: Build the image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}" \
            .

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name "${ACR_NAME}"

      - name: Push the image
        run: docker push "${IMAGE}"

      - name: Install the Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes --only-show-errors

      # Only the image changes. Environment variables, secrets, ingress, scale rules and probes of the app are left exactly as configured in Azure.
      - name: Deploy the image to the Container App
        run: |
          az containerapp update \
            --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${IMAGE}" \
            --output none

      # Wait for the revision that runs this image to be healthy, then ask the application itself (the public readiness endpoint: it answers status only, no details).
      - name: Verify the new revision
        run: |
          set -euo pipefail
          revision=""
          for attempt in $(seq 1 30); do
            row=$(az containerapp revision list \
              --name "${AZURE_CONTAINER_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query "[?properties.template.containers[0].image=='${IMAGE}'] | [0].[name, properties.runningState, properties.healthState]" \
              --output tsv)
            revision=$(echo "${row}" | cut -f1); running=$(echo "${row}" | cut -f2); health=$(echo "${row}" | cut -f3)
            echo "attempt ${attempt}: revision=${revision:-none} running=${running:-?} health=${health:-?}"
            case "${running}" in
              Failed|Degraded) echo "::error::Revision ${revision} is ${running}. The previous revision keeps serving; see docs/deployment/github-actions-dev.md (rollback)."; exit 1 ;;
            esac
            if [[ "${running}" == Running* && "${health}" == "Healthy" ]]; then break; fi
            if [[ "${attempt}" == 30 ]]; then echo "::error::Revision did not become healthy in 5 minutes."; exit 1; fi
            sleep 10
          done

          fqdn=$(az containerapp show --name "${AZURE_CONTAINER_APP}" --resource-group "${AZURE_RESOURCE_GROUP}" --query "properties.configuration.ingress.fqdn" --output tsv)
          if [[ -z "${fqdn}" ]]; then echo "::warning::The app has no external ingress; skipped the HTTP readiness check."; exit 0; fi
          for attempt in $(seq 1 18); do
            body=$(curl --silent --show-error --max-time 10 "https://${fqdn}/actuator/health/readiness" || true)
            echo "readiness attempt ${attempt}: ${body:-no answer}"
            if echo "${body}" | grep -q '"status":"UP"'; then echo "Readiness is UP on revision ${revision}."; exit 0; fi
            sleep 10
          done
          echo "::error::Readiness did not report UP in 3 minutes."; exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy to dev"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Container App: \`${AZURE_CONTAINER_APP}\` (resource group \`${AZURE_RESOURCE_GROUP}\`)"
          } >> "${GITHUB_STEP_SUMMARY}"
