# Local development database only. Credentials come from the environment (see README); nothing is hardcoded.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ana_depot
      POSTGRES_USER: ${DB_USER:-ana_depot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your shell or .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ana_depot_pg:/var/lib/postgresql/data
volumes:
  ana_depot_pg:
