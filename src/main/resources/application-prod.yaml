# Production, on ANY standard PostgreSQL (Supabase, Azure Database for PostgreSQL, AWS RDS, self-hosted): this profile holds operational settings only, never
# business behaviour, and has no provider-specific values. Activate with SPRING_PROFILES_ACTIVE=prod.
# Required environment (the application REFUSES TO START without them, see ProductionConfigGuard):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#   SUPABASE_URL or SUPABASE_JWT_ISSUER (token verification: authentication is independent of where the database runs), and a trusted-proxy list when behind a proxy.
# Connection string, TLS, role and Flyway connection per provider: docs/database-providers.md (Supabase specifics: docs/supabase-database.md).
spring:
  datasource:
    hikari:
      # One pool per backend instance. Total server connections = instances x maximum-pool-size, and must stay well under the database's
      # limit (small plans of every managed service allow only a few dozen connections; the provider's console shows the exact number for your size).
      # Every value below can be overridden without a code change: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, ..._KEEPALIVE_TIME, ..._MAX_LIFETIME.
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1500000             # 25 min: below the idle/lifetime cut-offs of poolers and load balancers, so the pool retires connections itself
      idle-timeout: 300000
      keepalive-time: 300000            # a cheap ping on idle connections so a silent network drop is noticed before a user request hits it
      connection-timeout: 5000
  jpa:
    show-sql: false
  flyway:
    # Migrations run at start-up on the main connection unless SPRING_FLYWAY_URL / _USER / _PASSWORD point Flyway at a direct or
    # session-mode connection (REQUIRED when the application itself uses a transaction pooler). Keep the same role (it must own the tables, docs/database-providers.md).
    connect-retries: 3
ana:
  staff:
    require-mfa: ${ANA_STAFF_REQUIRE_MFA:true}   # D15 (owner-approved): production staff need a second factor. Enrol every member (and make recovery codes) BEFORE the first production sign-in; false is a deliberate, logged opt-out
  mail:
    mode: ${ANA_MAIL_MODE:smtp}      # production sends real e-mail: a missing SMTP setting stops the start-up with a message naming the variable (ANA_MAIL_MODE=disabled is an explicit, logged opt-out)
management:
  endpoint:
    health:
      show-details: never
