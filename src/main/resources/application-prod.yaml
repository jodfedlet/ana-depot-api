# Production (Supabase PostgreSQL). Activate with SPRING_PROFILES_ACTIVE=prod.
# Required environment (the application REFUSES TO START without them, see ProductionConfigGuard):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#   SUPABASE_URL or SUPABASE_JWT_ISSUER (token verification), and a trusted-proxy list when behind a proxy.
# Choosing the connection string (direct / session pooler / transaction pooler) and the Flyway connection: docs/supabase-database.md.
spring:
  datasource:
    hikari:
      # One pool per backend instance. Total server connections = instances x maximum-pool-size, and must stay well under the database's
      # limit (Supabase small plans allow only a few dozen direct connections; the dashboard shows the exact number for your compute size).
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1500000             # 25 min: below the idle/lifetime cut-offs of poolers and load balancers, so the pool retires connections itself
      idle-timeout: 300000
      keepalive-time: 300000            # a cheap ping on idle connections so a silent network drop is noticed before a user request hits it
      connection-timeout: 5000
  jpa:
    show-sql: false
  flyway:
    # Migrations run at start-up on the main connection unless SPRING_FLYWAY_URL / _USER / _PASSWORD point Flyway at a direct or
    # session-mode connection (REQUIRED when the application itself uses the transaction pooler).
    connect-retries: 3
ana:
  mail:
    mode: ${ANA_MAIL_MODE:smtp}      # production sends real e-mail: a missing SMTP setting stops the start-up with a message naming the variable (ANA_MAIL_MODE=disabled is an explicit, logged opt-out)
management:
  endpoint:
    health:
      show-details: never
