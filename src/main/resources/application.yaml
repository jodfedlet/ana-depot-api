spring:
  application:
    name: ana-depot-api
  # The datasource has NO defaults here: the URL, user and password come from SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME /
  # SPRING_DATASOURCE_PASSWORD (Spring Boot binds them natively) or from the `local` profile. Never commit real values.
  datasource:
    hikari:
      pool-name: ana-depot
      connection-timeout: 5000          # fail fast: a request should not wait on the pool for longer than a user will
      validation-timeout: 3000
      initialization-fail-timeout: 10000 # fail the start-up quickly when the database cannot be reached
      data-source-properties:            # pgjdbc driver properties: every wait on the network is bounded (docs/operations.md, "Timeouts")
        connectTimeout: 5                # seconds to open the TCP connection
        loginTimeout: 10                 # seconds for the whole authentication handshake
        socketTimeout: 60                # seconds without a reply: a hard backstop ABOVE the 20 s transaction timeout below, so the SQL-level timeout fires first
        tcpKeepAlive: true
  jpa:
    open-in-view: false                # no lazy loading in the web layer; use cases decide their transactions
    hibernate:
      ddl-auto: validate               # the schema belongs to Flyway; Hibernate only verifies the entities match it
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  transaction:
    default-timeout: 20s               # every transaction (and so every statement or lock wait inside it) is cancelled by the database after 20 s
  mvc:
    async:
      request-timeout: 30s
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s

server:
  shutdown: graceful
  forward-headers-strategy: none       # X-Forwarded-* are handled by our own trusted-proxy logic, never blindly
  tomcat:
    connection-timeout: 10s            # a client that opens a connection and sends nothing (slowloris) is dropped
    keep-alive-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus     # /actuator/prometheus is NOT public: see docs/operations.md (private management port)
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:                              # "the process is alive": never depends on the database (a DB outage must not restart the app)
          include: livenessState
        readiness:                             # "send me traffic": the database is required for catalog, reservations and payments
          include: readinessState,db
        dependencies:                          # informational, NOT used by load balancers: object storage is optional (uploads only)
          include: db,storage
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true             # histogram buckets so p95/p99 can be computed (and aggregated across instances) from Prometheus
      slo:
        http.server.requests: 100ms,300ms,1s,3s
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs                     # JSON logs; the correlationId MDC key is included on every line

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Operational limits and external configuration (see docs/auth.md and docs/adr).
ana:
  headers:
    hsts: ${ANA_HSTS_ENABLED:false}                      # true in production (HTTPS-only): sends Strict-Transport-Security even behind a TLS-terminating proxy
  cors:
    allowed-origins: ${ANA_CORS_ALLOWED_ORIGINS:}        # comma-separated exact origins of the storefront (e.g. https://www.example.com); empty = no browser origin allowed
  legal:
    terms-version: ${ANA_TERMS_VERSION:}                 # label of the reservation terms in force; the legal TEXT is supplied separately by the business
  security:
    supabase-url: ${SUPABASE_URL:}                       # project URL; the issuer defaults to <supabase-url>/auth/v1 when SUPABASE_JWT_ISSUER is empty
    jwt-issuer: ${SUPABASE_JWT_ISSUER:}                 # e.g. https://<project-ref>.supabase.co/auth/v1 ; with supabase-url also empty = every token is rejected
    jwks-uri: ${SUPABASE_JWKS_URL:}                     # optional override of <issuer>/.well-known/jwks.json (private network, proxy)
    jwt-audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    bootstrap-admin-subject: ${ANA_BOOTSTRAP_ADMIN_SUBJECT:}
  rate-limit:
    enabled: true
    trusted-proxies: []                                 # CIDRs/IPs of YOUR reverse proxies; empty = X-Forwarded-For is ignored
    default-limit: { max-requests: 120, window: PT1M }
    limits:
      "[catalog.read]": { max-requests: 300, window: PT1M }
      "[catalog.search]": { max-requests: 60, window: PT1M }
      "[reservation.submit]": { max-requests: 10, window: PT10M }
      "[reservation.lookup]": { max-requests: 20, window: PT10M }
      "[reservation.lookup.reference]": { max-requests: 30, window: PT10M }   # per reference, whatever the caller: stops phone guessing from many addresses
      "[account.read]": { max-requests: 120, window: PT1M }
      "[account.write]": { max-requests: 20, window: PT10M }
      "[upload.request]": { max-requests: 30, window: PT1M }
      "[admin.write]": { max-requests: 240, window: PT1M }
      "[admin.reindex]": { max-requests: 3, window: PT10M }
      "[webhook.receive]": { max-requests: 300, window: PT1M }
      "[payment.checkout]": { max-requests: 10, window: PT10M }
      "[payment.status]": { max-requests: 60, window: PT1M }
      "[staff.accept]": { max-requests: 5, window: PT10M }
      "[staff.recovery]": { max-requests: 5, window: PT15M }
  staff:
    require-mfa: ${ANA_STAFF_REQUIRE_MFA:false}                 # true = staff access needs a session that passed a second factor (Supabase aal2); recommended for production
    invitation-days: ${ANA_STAFF_INVITATION_DAYS:7}
    recovery-session-ttl: ${ANA_STAFF_RECOVERY_SESSION_TTL:PT4H}    # how long a redeemed recovery code lets that sign-in session use the administration (never longer than the session)
  stripe:                                                       # online payment (docs/payments-stripe.md); OFF unless ANA_STRIPE_ENABLED=true
    enabled: ${ANA_STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}                           # backend only; sk_test_ locally, sk_live_ only in production
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}                   # signing secret of the webhook endpoint (whsec_)
    enabled-currencies: ${ANA_STRIPE_ENABLED_CURRENCIES:}       # e.g. USD; a currency is offered only if Stripe also supports it for the account
    return-base-url: ${ANA_STRIPE_RETURN_BASE_URL:}             # web origin customers return to (https; http only for localhost)
    checkout-expiration-minutes: ${ANA_STRIPE_CHECKOUT_EXPIRATION_MINUTES:30}
    api-base: ${ANA_STRIPE_API_BASE:}                           # only to point a local test double at the SDK; leave empty
  mail:                                                          # customer e-mail (docs/notifications.md); EVERY value comes from the environment, nothing real is committed
    mode: ${ANA_MAIL_MODE:log}                                   # smtp = send | log = development: write .eml files, send nothing (rows end CAPTURED) | disabled = queue and do NOT send
    from-address: ${ANA_MAIL_FROM_ADDRESS:}
    from-name: ${ANA_MAIL_FROM_NAME:Ana Dépôt}
    reply-to: ${ANA_MAIL_REPLY_TO:}
    web-base-url: ${ANA_WEB_BASE_URL:}                           # storefront origin for the tracking link; empty = the e-mail explains in words (no link is invented)
    terms-url: ${ANA_MAIL_TERMS_URL:}                            # optional legal links; shown only when set
    privacy-url: ${ANA_MAIL_PRIVACY_URL:}
    capture-directory: ${ANA_MAIL_CAPTURE_DIR:target/mail-capture}
    per-recipient-per-hour: ${ANA_MAIL_PER_RECIPIENT_PER_HOUR:10}
    smtp:
      host: ${ANA_MAIL_SMTP_HOST:}
      port: ${ANA_MAIL_SMTP_PORT:587}
      username: ${ANA_MAIL_SMTP_USERNAME:}
      password: ${ANA_MAIL_SMTP_PASSWORD:}                       # secret: environment or secret manager only
      auth: ${ANA_MAIL_SMTP_AUTH:true}
      starttls: ${ANA_MAIL_SMTP_STARTTLS:true}
      ssl: ${ANA_MAIL_SMTP_SSL:false}
      connection-timeout: ${ANA_MAIL_SMTP_CONNECTION_TIMEOUT:5s}
      read-timeout: ${ANA_MAIL_SMTP_READ_TIMEOUT:10s}
      write-timeout: ${ANA_MAIL_SMTP_WRITE_TIMEOUT:10s}
    dispatcher:
      enabled: ${ANA_MAIL_DISPATCHER_ENABLED:true}
      poll-interval: ${ANA_MAIL_POLL_INTERVAL:PT5S}
      batch-size: 20
      max-attempts: ${ANA_MAIL_MAX_ATTEMPTS:8}                   # then DEAD (visible to staff, retry by hand)
      initial-backoff: ${ANA_MAIL_INITIAL_BACKOFF:PT1M}           # first retry delay (doubles each time, jittered, capped by max-backoff)
      backoff-multiplier: 2.0
      max-backoff: PT6H
      lease: PT2M
      important-max-age: ${ANA_MAIL_IMPORTANT_MAX_AGE:14d}      # IMPORTANT messages (decision, ready, cancelled, expired, payment received) are kept this long; they are still checked against the reservation's current state before sending
      max-age: ${ANA_MAIL_MAX_AGE:72h}                           # a message older than this is not sent any more (it would no longer be true)
  outbox:
    dispatcher-enabled: true
  upload:
    url-ttl: ${R2_PRESIGNED_URL_EXPIRATION_SECONDS:600}s        # how long a presigned upload URL is valid (R2: 1 second to 7 days)
    max-bytes: ${R2_MAX_UPLOAD_SIZE_BYTES:5242880}              # largest accepted image
    abandoned-after: PT1H
    cleanup-interval: PT15M
  storage:
    r2:                                                          # Cloudflare R2; nothing set = uploads disabled (fail closed). docs/storage-r2.md
      account-id: ${R2_ACCOUNT_ID:}
      bucket-name: ${R2_BUCKET_NAME:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      endpoint: ${R2_ENDPOINT:}                                  # default https://<R2_ACCOUNT_ID>.r2.cloudflarestorage.com
      public-base-url: ${R2_PUBLIC_BASE_URL:}                    # custom domain the bucket is publicly readable from (ADR 0014)
