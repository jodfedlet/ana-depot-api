<!DOCTYPE html>
<!--/* payment-received: reference, intro, paymentDetail, balances, track. Layout, colours and every block live in html/fragments.html. */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{html/fragments :: layout(#{email.paymentReceived.title}, #{email.paymentReceived.preheader}, ~{::main})}">
<body>
<th:block th:fragment="main">
<th:block th:replace="~{html/fragments :: referenceBox}"></th:block>
<p th:replace="~{html/fragments :: paragraph(#{email.paymentReceived.intro})}"></p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 6px 0;"><tr><td bgcolor="#eaf3f1" style="background:#eaf3f1;border:1px solid #c9ded9;border-radius:6px;padding:14px 16px;">
  <div style="font-size:13px;color:#55524b;" th:text="#{email.payment.received}">Montant reçu</div>
  <div style="font-size:24px;font-weight:bold;color:#0b3732;" th:text="${v.payment().amount()}">0,00 HTG</div>
  <div style="font-size:14px;color:#55524b;" th:text="#{email.payment.how(#{${v.payment().methodKey()}}, ${v.payment().date()})}">méthode · date</div>
</td></tr></table>
<th:block th:replace="~{html/fragments :: balances}"></th:block>
<p th:replace="~{html/fragments :: paragraph(#{email.track.text})}"></p>
<table th:replace="~{html/fragments :: button(${v.trackUrl()}, #{email.track.button})}"></table>
</th:block>
</body>
</html>
