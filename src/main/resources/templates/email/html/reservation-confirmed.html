<!DOCTYPE html>
<!--/* reservation-confirmed: reference, intro, pickup, paymentOptions, balances, track. Layout, colours and every block live in html/fragments.html. */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{html/fragments :: layout(#{email.confirmed.title}, #{email.confirmed.preheader}, ~{::main})}">
<body>
<th:block th:fragment="main">
<th:block th:replace="~{html/fragments :: referenceBox}"></th:block>
<p th:replace="~{html/fragments :: paragraph(#{email.confirmed.intro})}"></p>
<th:block th:replace="~{html/fragments :: pickup}"></th:block>
<th:block th:replace="~{html/fragments :: paymentOptions}"></th:block>
<th:block th:replace="~{html/fragments :: balances}"></th:block>
<p th:replace="~{html/fragments :: paragraph(#{email.track.text})}"></p>
<table th:replace="~{html/fragments :: button(${v.trackUrl()}, #{email.track.button})}"></table>
</th:block>
</body>
</html>
