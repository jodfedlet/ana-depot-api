<!DOCTYPE html>
<!--/* reservation-rejected: reference, intro, reason, payments, track. Layout, colours and every block live in html/fragments.html. */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{html/fragments :: layout(#{email.rejected.title}, #{email.rejected.preheader}, ~{::main})}">
<body>
<th:block th:fragment="main">
<th:block th:replace="~{html/fragments :: referenceBox}"></th:block>
<p th:replace="~{html/fragments :: paragraph(#{email.rejected.intro})}"></p>
<p th:replace="~{html/fragments :: paragraph(#{${'email.reason.' + v.reasonKey()}})}"></p>
<th:block th:replace="~{html/fragments :: payments}"></th:block>
<p th:replace="~{html/fragments :: paragraph(#{email.track.text})}"></p>
<table th:replace="~{html/fragments :: button(${v.trackUrl()}, #{email.track.button})}"></table>
</th:block>
</body>
</html>
